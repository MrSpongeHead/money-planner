<!doctype html>
<html lang="en-GB" class="size-m theme-light no-motion">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Money Planner</title>
<meta name="description" content="A calm, visual money planner.">
<meta name="theme-color" content="#F4F6F8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Money">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/atkinson-400.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Atkinson Hyperlegible";font-style:normal;font-weight:400;font-display:swap;src:url("fonts/atkinson-400.woff2") format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-style:normal;font-weight:700;font-display:swap;src:url("fonts/atkinson-700.woff2") format("woff2")}

:root{
  --bg:#F4F6F8;--card:#FFFFFF;--ink:#1F2933;--muted:#52606D;--line:#DDE3E8;--track:#E9EDF1;
  --primary:#0F5F66;--on-primary:#FFFFFF;--primary-soft:#E3F1F1;--primary-deep:#0B474C;--primary-mid:#4E9C95;--primary-light:#A8D5CE;
  --ok:#1E7A46;--ok-bg:#E7F4EC;--ok-ink:#17603A;
  --warn:#C98A00;--warn-bg:#FDF3DC;--warn-ink:#6E4A00;
  --stop:#B42318;--stop-bg:#FCEBEA;--stop-ink:#8F1C13;
  --scrim:rgba(31,41,51,.6);
  color-scheme:light;
}
html.theme-soft{
  --bg:#F1EEE7;--card:#FBFAF6;--ink:#2A2A28;--muted:#56524B;--line:#DCD7CC;--track:#E6E1D6;
  --primary:#2D6764;--primary-soft:#E2ECE8;--primary-deep:#1F4B49;--primary-mid:#6E9F98;--primary-light:#B7D3CC;
}
html.theme-dark{
  --bg:#12181D;--card:#1C252C;--ink:#E8EDF1;--muted:#AAB5BF;--line:#33404A;--track:#2B3740;
  --primary:#5BB8B2;--on-primary:#0B1F21;--primary-soft:#173236;--primary-deep:#9AD8D3;--primary-mid:#3E8C86;--primary-light:#2C6762;
  --ok:#4CB27A;--ok-bg:#16301F;--ok-ink:#93DDB2;
  --warn:#E0A526;--warn-bg:#33270C;--warn-ink:#F2C76B;
  --stop:#E2574A;--stop-bg:#3A1714;--stop-ink:#F6A79F;
  --scrim:rgba(0,0,0,.7);
  color-scheme:dark;
}
html{font-size:16px;-webkit-text-size-adjust:100%}
html.size-s{font-size:15px}
html.size-l{font-size:18px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.35}
html.no-motion *{transition:none!important;animation:none!important;scroll-behavior:auto!important}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary)}
h1,h2,h3,p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.screen{flex:1;display:flex;flex-direction:column;gap:.85rem;padding:calc(1.1rem + env(safe-area-inset-top)) 1.15rem 1.2rem}
.has-nav .screen{padding-bottom:calc(6.2rem + env(safe-area-inset-bottom))}
.screen.tint{background:var(--primary-soft)}
.screen.warn{background:var(--warn-bg)}
.screen.stop{background:var(--stop-bg)}

/* header */
.hdr{display:flex;justify-content:space-between;align-items:center;gap:.5rem;min-height:2.75rem}
.hdr .titles{display:flex;flex-direction:column;gap:.1rem;min-width:0}
.hdr .sub{font-size:.94rem;color:var(--muted)}
.hdr h1{font-size:1.75rem;line-height:1.15}
.hdr .tools{display:flex;gap:.5rem;align-items:center;flex:none}
.hdr.back{justify-content:flex-start}
.hdr.back h1{font-size:1.5rem}
.round{width:2.75rem;height:2.75rem;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;padding:0;cursor:pointer;flex:none;text-decoration:none}
.round.plain{border:0;background:transparent}
.round.q{font-weight:700;font-size:1.3rem;color:var(--primary)}
.chip-pay{display:flex;flex-direction:column;align-items:center;background:var(--primary-soft);color:var(--primary-deep);border-radius:.9rem;padding:.4rem .7rem;line-height:1.1;text-decoration:none}
.chip-pay b{font-size:1.4rem}
.chip-pay span{font-size:.72rem}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:1.15rem;padding:1rem 1.1rem;display:flex;flex-direction:column;gap:.6rem}
.card.tight{padding:.7rem .85rem;border-radius:.9rem}
.card.hero{background:var(--primary);color:var(--on-primary);border:0}
.card.soft{background:var(--primary-soft);border:0;color:var(--primary-deep)}
.card.ok{background:var(--ok-bg);border:0}
.card.warn{background:var(--warn-bg);border:0}
.card.stop{background:var(--stop-bg);border:0}
.card.row{flex-direction:row;align-items:center}
.card.row.top{align-items:flex-start}
.card h2{font-size:1.05rem}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.tiny{font-size:.78rem}
.big{font-size:4rem;font-weight:700;line-height:1;letter-spacing:-.01em}
.mid{font-size:1.5rem;font-weight:700}
.row{display:flex;align-items:center;gap:.7rem}
.row.between{justify-content:space-between}
.row.top{align-items:flex-start}
.grow{flex:1;min-width:0}
.col{display:flex;flex-direction:column;gap:.2rem}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.6rem}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.5rem}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.5rem}
.tile{background:var(--bg);border-radius:.75rem;padding:.6rem .75rem;display:flex;flex-direction:column;gap:.1rem}
html.theme-dark .tile{background:var(--track)}
.tile .l{font-size:.8rem;color:var(--muted)}
.tile .v{font-size:1.45rem;font-weight:700}
.sec-title{font-size:1.05rem;font-weight:700;display:flex;align-items:center;gap:.4rem}
.list{display:flex;flex-direction:column;gap:.45rem}
.item{display:flex;align-items:center;gap:.7rem;background:var(--card);border:1px solid var(--line);border-radius:.85rem;padding:.6rem .75rem;min-height:3.2rem;text-decoration:none;color:var(--ink);width:100%;text-align:left;cursor:pointer}
.item .name{font-weight:700;font-size:.97rem}
.item .meta{font-size:.82rem;color:var(--muted)}
.item .amt{font-weight:700;font-size:1rem;white-space:nowrap}
.ico-box{width:2.5rem;height:2.5rem;border-radius:.65rem;background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center;flex:none}
.swatch{width:2.1rem;height:1.5rem;border-radius:.32rem;flex:none}
.swatch.sm{width:1.15rem;height:.8rem;border-radius:.2rem}
.dot{width:.75rem;height:.75rem;border-radius:.2rem;display:inline-block;flex:none}

/* status */
.status{display:flex;gap:.75rem;align-items:center;border-radius:1rem;padding:.75rem .9rem}
.status.ok{background:var(--ok-bg);color:var(--ok-ink)}
.status.warn{background:var(--warn-bg);color:var(--warn-ink)}
.status.stop{background:var(--stop-bg);color:var(--stop-ink)}
.status b{font-size:1.1rem}
.status .t{font-size:.9rem}
.ok-ink{color:var(--ok-ink)}.warn-ink{color:var(--warn-ink)}.stop-ink{color:var(--stop-ink)}
.flag{display:inline-flex;align-items:center;gap:.3rem;font-weight:700;font-size:.85rem}

/* bars */
.bar{position:relative;height:1.75rem;background:var(--track);border-radius:999px}
.bar.thin{height:.85rem}
.bar.xthin{height:.65rem}
.bar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--primary)}
.bar .line{position:absolute;top:-.4rem;bottom:-.4rem;width:3px;border-radius:2px;background:var(--ink)}
.stack{display:flex;gap:2px;height:1.9rem}
.stack span:first-child{border-radius:.4rem 0 0 .4rem}
.stack span:last-child{border-radius:0 .4rem .4rem 0}
.hbars{display:flex;flex-direction:column;gap:.55rem}
.hbar .top{display:flex;justify-content:space-between;font-size:.9rem;gap:.5rem}

/* buttons */
.btn{min-height:3.5rem;border-radius:1rem;border:0;background:var(--primary);color:var(--on-primary);font-size:1.08rem;font-weight:700;display:flex;align-items:center;justify-content:center;gap:.5rem;padding:0 1rem;cursor:pointer;text-decoration:none;text-align:center;width:100%}
.btn.sec{background:var(--card);color:var(--primary);border:2px solid var(--primary)}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line);font-weight:400}
.btn.danger{background:var(--card);color:var(--stop-ink);border:2px solid var(--stop)}
.btn.sm{min-height:2.75rem;font-size:.92rem;border-radius:.75rem}
.btn[disabled]{opacity:.45;cursor:default}
.btnrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.6rem}
.btnrow.one-two{grid-template-columns:1fr 2fr}
.btnrow.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.push{margin-top:auto}
.linkbtn{background:none;border:0;color:var(--primary);font-weight:700;cursor:pointer;padding:.5rem 0;min-height:2.75rem;text-align:left;font-size:.95rem;text-decoration:underline}

/* segmented + choices */
.seg{display:grid;gap:.35rem;background:var(--track);border-radius:.8rem;padding:.25rem}
.seg button{min-height:2.75rem;border:0;border-radius:.6rem;background:transparent;font-size:.92rem;cursor:pointer;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--primary);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.choice{min-height:3.4rem;border-radius:.85rem;border:2px solid var(--line);background:var(--card);font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:.4rem;padding:.3rem .5rem;color:var(--ink)}
.choice[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft);color:var(--primary-deep);font-weight:700}
.choice.solid[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
.cat{flex-direction:column;min-height:3.9rem;font-size:.8rem;gap:.2rem}
.pills{display:flex;gap:.4rem;flex-wrap:wrap}
.pill{min-height:2.75rem;border-radius:999px;border:2px solid var(--line);background:var(--card);padding:0 .9rem;font-size:.9rem;cursor:pointer;display:inline-flex;align-items:center;gap:.4rem;color:var(--ink)}
.pill[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft);color:var(--primary-deep);font-weight:700}

/* forms */
label.fld{display:flex;flex-direction:column;gap:.3rem;font-size:.9rem;font-weight:700}
label.fld .hint{font-weight:400;color:var(--muted);font-size:.82rem}
.inp{border:1px solid #9AA5B1;border-radius:.75rem;padding:.7rem .8rem;font-size:1.05rem;background:var(--card);color:var(--ink);width:100%;min-height:3rem}
html.theme-dark .inp{border-color:#5B6875}
.inp:focus{outline:3px solid var(--primary-light);border-color:var(--primary)}
.inp.amount{font-size:2.3rem;font-weight:700;border:0;padding:0;min-height:0;background:transparent}
.amountbox{background:var(--card);border:1px solid var(--line);border-radius:1rem;padding:.6rem 1rem;display:flex;flex-direction:column;gap:.1rem}
.amountbox .lab{font-size:.85rem;color:var(--muted)}
.amountrow{display:flex;align-items:center;gap:.2rem;font-size:2.3rem;font-weight:700}
.err{color:var(--stop-ink);font-weight:700;font-size:.9rem}
.switch{width:3.5rem;height:2rem;border-radius:999px;border:0;background:#8A949E;position:relative;padding:0;cursor:pointer;flex:none}
.switch::after{content:"";position:absolute;left:.25rem;top:.25rem;width:1.5rem;height:1.5rem;border-radius:999px;background:#fff}
.switch[aria-checked="true"]{background:var(--primary)}
.switch[aria-checked="true"]::after{left:auto;right:.25rem}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:.7rem;padding-top:.6rem;border-top:1px solid var(--track)}
.setrow:first-of-type{border-top:0;padding-top:0}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:.35rem .4rem calc(.35rem + env(safe-area-inset-bottom));z-index:20}
.nav .in{max-width:480px;margin:0 auto;display:flex;justify-content:space-around;align-items:center}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15rem;min-width:3.6rem;min-height:3.4rem;text-decoration:none;color:var(--muted);font-size:.78rem}
.nav a[aria-current="page"]{color:var(--primary);font-weight:700}
.nav a.plus{width:3.5rem;height:3.5rem;min-width:0;min-height:0;border-radius:999px;background:var(--primary);color:var(--on-primary)}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.25rem}
.cal .dow{text-align:center;font-size:.78rem;color:var(--muted)}
.cal button{height:3.4rem;border-radius:.6rem;border:2px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:.25rem 0;cursor:pointer;color:var(--ink);font-size:.9rem}
.cal button.past{background:var(--track);border-color:var(--track)}
.cal button.today{background:var(--primary-soft);border-color:var(--primary);color:var(--primary-deep);font-weight:700}
.cal button.sel{border-color:var(--ink);font-weight:700}
.cal .blank{height:3.4rem}
.cal .marks{display:flex;gap:.18rem;align-items:center;height:.9rem}
.billmark{width:.7rem;height:.7rem;border-radius:.18rem;background:var(--ink);display:inline-block}

/* jars */
.jar{display:flex;flex-direction:column;align-items:center;gap:.35rem;text-align:center}
.jar .lid{width:3rem;height:.6rem;border-radius:.25rem;background:var(--muted)}
.jar .body{width:4.9rem;height:7rem;border:3px solid var(--muted);border-radius:.75rem .75rem 1.25rem 1.25rem;position:relative;overflow:hidden;background:var(--bg);margin-top:-.25rem}
.jar .lvl{position:absolute;left:0;right:0;bottom:0}
.jar .pct{position:absolute;left:0;right:0;top:.45rem;font-weight:700;font-size:1.1rem}

/* sheet / overlays */
.overlay{position:fixed;inset:0;background:var(--scrim);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:480px;border-radius:1.5rem 1.5rem 0 0;padding:1rem 1.2rem calc(1.4rem + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:.8rem;max-height:88vh;overflow:auto}
.sheet .grab{align-self:center;width:2.75rem;height:.32rem;border-radius:.2rem;background:var(--line)}
.numdot{width:1.9rem;height:1.9rem;border-radius:999px;background:var(--primary-soft);color:var(--primary);font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}

/* tour */
.progress{display:grid;gap:.4rem}
.progress span{height:.5rem;border-radius:.25rem;background:var(--primary-light)}
.progress span.on{background:var(--primary)}
.tour-art{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.75rem;min-height:14rem}
.tour h1{font-size:1.85rem;line-height:1.2}
.tour p{font-size:1.12rem;line-height:1.45}

/* steps */
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.5rem}
.steps a{display:flex;align-items:center;gap:.75rem;background:var(--card);border:2px solid var(--line);border-radius:.9rem;padding:.6rem .75rem;text-decoration:none;color:var(--ink);min-height:3.6rem}
.steps a.now{border-color:var(--primary)}
.stepnum{width:2rem;height:2rem;border-radius:999px;border:2px solid #8A949E;color:var(--muted);font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.now .stepnum{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(6.5rem + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:.7rem 1rem;border-radius:.8rem;z-index:60;font-weight:700;max-width:90vw;text-align:center}

/* print sheet */
.paper{background:#fff;color:#1F2933;width:100%;max-width:794px;margin:0 auto;padding:2rem;display:flex;flex-direction:column;gap:1.1rem}
.paper table{width:100%;border-collapse:collapse;font-size:1rem}
.paper th,.paper td{border:1px solid #8A949E;padding:.45rem .6rem}
.paper th{background:#E3F1F1;text-align:left}
.paper td{height:2.9rem}
.paper .box{border:2px solid #0F5F66;border-radius:.75rem;padding:.6rem .9rem}
.paper .lines div{border-bottom:1px solid #C5CDD5;height:1.8rem}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff}
  .noprint,.nav,.toast{display:none!important}
  .paper{padding:0;max-width:none}
  #app{max-width:none}
}

.cpick{width:2.6rem;height:2.6rem;border-radius:999px;border:3px solid transparent;padding:0;cursor:pointer}
.cpick[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 3px var(--card);transform:scale(1.08)}
h1:focus{outline:none}

</style>
</head>
<body>
<div id="app"><main class="screen"><p>Loading…</p></main></div>
<noscript><p style="padding:1rem">Money Planner needs JavaScript turned on.</p></noscript>
<script>
'use strict';
/* ===== Money Planner – core: storage, dates, money maths ===== */

var STORE_KEY = 'moneyPlanner.v1';
var APP_VERSION = '1.3.0';

function uid() { return Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4); }

function defaultState() {
  return {
    v: 1,
    startDate: null,          // first day the app was used (YYYY-MM-DD)
    setupDone: false,
    setupStep: 0,             // furthest setup step reached
    tourDone: false,
    incomes: [],              // {id,name,amount,freq,day,weekday,start}
    bills: [],                // {id,name,amount,freq,day,weekday,start,category}
    accounts: [],             // {id,name,colour,balance,limit,apr,payDay,payment,zeroDeal,zeroEnds,lastPaid}
    debts: [],                // {id,type,owedTo,name,colour,balance,original,apr,payDay,payment,lastPaid}
    pots: [],                 // {id,name,colour,saved,goal,monthly,by,lastAdded}
    tx: [],                   // {id,date,type:'in'|'out',amount,category,name,paidWith,planned}
    wish: [],                 // {id,name,price,added,paidWith}
    settings: {
      textSize: 'm', motion: false, vibrate: false, warnStyle: 'full', theme: 'light',
      remindDays: 3, remindOnDay: true, checkInDay: 0, startDay: 1,
      pinLock: false, pin: null,
      helper: { balances: true, purchases: false, weekly: true },
      rules: { closeLimit: 80, stopLimit: 90 },
      region: 'ew'
    },
    payOverrides: {},          // 'incomeId|nominal date' -> actual date (pay came early or late)
    payLate: null, leftoverDone: {}, shiftNoteDone: false,
    lastWarn: null, lastBackup: null, lastCheckIn: null, lastHelperSend: null
  };
}

function mergeDefaults(s) {
  var d = defaultState();
  if (!s || typeof s !== 'object') return d;
  Object.keys(d).forEach(function (k) { if (s[k] === undefined) s[k] = d[k]; });
  Object.keys(d.settings).forEach(function (k) { if (s.settings[k] === undefined) s.settings[k] = d.settings[k]; });
  if (!s.settings.helper) s.settings.helper = d.settings.helper;
  if (!s.settings.rules) s.settings.rules = d.settings.rules;
  if (!s.payOverrides || typeof s.payOverrides !== 'object') s.payOverrides = {};
  if (!s.leftoverDone || typeof s.leftoverDone !== 'object') s.leftoverDone = {};
  ['incomes', 'bills', 'accounts', 'debts', 'pots', 'tx', 'wish'].forEach(function (k) { if (!Array.isArray(s[k])) s[k] = []; });
  return s;
}

var S = (function () {
  try { var raw = localStorage.getItem(STORE_KEY); if (raw) return mergeDefaults(JSON.parse(raw)); } catch (e) {}
  return defaultState();
})();

var storageOK = true;
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); storageOK = true; }
  catch (e) { storageOK = false; }
}

/* ---------- dates (all local time) ---------- */
var DAY_NAMES = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
var MONTH_NAMES = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

function pad2(n) { return (n < 10 ? '0' : '') + n; }
function iso(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function parseISO(s) { var p = String(s).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function addDays(d, n) { var x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() + n); return x; }
function dim(y, m) { return new Date(y, m + 1, 0).getDate(); }
function monthKey(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1); }

function saveCard(id) {

function vInterest() {
  var list = allOwed().map(function (a) { return { a: a, n: a.limit !== undefined ? a.name : debtTitle(a), m: monthlyInterest(a), p: zeroActive(a) ? 0 : (a.apr || 0) / 12 }; });
  var total = list.reduce(function (s, x) { return s + x.m; }, 0);
  var h = backHeader('Which costs me most?', 'cards');
  if (!list.length) return h + empty('No cards or debts added yet.', 'cards', 'Go to What I owe');
  h += '<section class="card hero"><span>Interest is costing me about</span><span style="font-size:2.6rem;font-weight:700;line-height:1">' + money2(total) + ' <span style="font-size:1.1rem;font-weight:400">a month</span></span><span>That is about ' + money2(total * 12 / 365) + ' a day, or ' + money0(total * 12) + ' a year.</span></section>';
  function bars(arr, key, fmt, colour) {
    var max = Math.max.apply(null, arr.map(function (x) { return x[key]; }).concat([0.0001]));
    return arr.slice().sort(function (a, b) { return b[key] - a[key]; }).map(function (x) {
      return '<div class="hbar col" style="gap:.2rem"><div class="top"><span class="row" style="gap:.4rem"><span class="swatch sm" style="background:' + esc(x.a.colour) + '"></span>' + esc(x.n) + (zeroActive(x.a) ? ' (0% deal)' : '') + '</span><b>' + fmt(x[key]) + '</b></div>' + bar(x[key] / max * 100, colour, 'xthin') + '</div>';
    }).join('');
  }
  h += '<section class="card"><h2>Interest each month</h2><div class="hbars">' + bars(list, 'm', money2, 'var(--primary)') + '</div></section>';
  h += '<section class="card"><h2>Cost for every £100 I owe</h2><span class="small muted">Shows which account is the most expensive to owe money on.</span><div class="hbars">' + bars(list, 'p', money2, 'var(--primary-mid)') + '</div></section>';
  var top = list.filter(function (x) { return x.a.balance > 0 && x.p > 0; }).sort(function (a, b) { return b.p - a.p; })[0];

  h += '<p class="tiny muted">These are estimates (balance × APR ÷ 12). The real interest on a statement can be a little different.</p>';

}

/* ---------- Warning ---------- */

  h += '<section class="card"><b>' + (stop ? 'No spending money left until the new month:' : money0(c.left) + ' left until the end of the month. That is about ' + money2(each) + ' a day:') + '</b>' +
    '<div style="display:grid;grid-template-columns:repeat(' + (n + (c.daysLeft > 4 ? 2 : 1)) + ',minmax(0,1fr));gap:.35rem">' + boxes + '</div>' +

function buyResult(r) {
  var V = { ok: ['Yes, go ahead', 'It fits in my plan.'], warn: ['Think first', 'I can afford it, but it squeezes the rest of the month.'], stop: ['No, not now', 'This would cause a problem this month.'] }[r.verdict];
  var c = r.c, rows = '';
  if (r.price > c.left + 0.004) rows += reason(sig('stop', 24), 'It costs more than the <b>' + money0(Math.max(c.left, 0)) + '</b> spending money I have left this month.');
  else if (c.status === 'stop' && !r.planned) rows += reason(sig('stop', 24), 'I am in <b>Stop</b> mode until the new month.');
  if (r.card && r.card.limit > 0 && r.cardPctAfter > S.settings.rules.stopLimit) rows += reason(sig('stop', 24), 'It would take the <b>' + esc(r.card.name) + '</b> to ' + Math.round(r.cardPctAfter) + '% of its limit.');
  var afterPct = r.perDayNow > 0 ? r.perDayAfter / r.perDayNow * 100 : 0;
  rows += '<div class="card tight" style="border:0"><b class="small">My money each day would ' + (r.price > 0 ? 'drop' : 'stay the same') + '</b>' +
    '<div style="display:grid;grid-template-columns:3.2rem minmax(0,1fr) 4.2rem;gap:.35rem .5rem;align-items:center" class="small"><span class="muted">Now</span>' + bar(100, 'var(--primary)', 'xthin') + '<b style="text-align:right">' + money2(r.perDayNow) + '</b>' +
    '<span class="muted">After</span>' + bar(afterPct, 'var(--primary)', 'xthin') + '<b style="text-align:right">' + (r.afterNeg ? money2(0) : money2(r.perDayAfter)) + '</b></div></div>';
  if (isFinite(r.daysOfMoney) && r.daysOfMoney > 0) {
    var full = Math.floor(r.daysOfMoney), part = r.daysOfMoney - full, boxes = '';
    var shown = Math.min(Math.ceil(r.daysOfMoney), 6);
    for (var i = 0; i < shown; i++) { var fill = i < full ? 100 : Math.round(part * 100); boxes += '<span style="width:1.35rem;height:1.35rem;border-radius:.35rem;background:linear-gradient(90deg,var(--primary) ' + fill + '%,var(--track) ' + fill + '%)"></span>'; }
    var dtxt = r.daysOfMoney < 1 ? 'less than one day' : (Math.round(r.daysOfMoney * 2) / 2).toString().replace('.5', '½') + (r.daysOfMoney >= 1.25 ? ' days' : ' day');
    rows += reason('<span role="img" aria-label="' + dtxt + ' of spending money" style="display:flex;gap:.2rem;flex:none">' + boxes + '</span>', 'It costs <b>' + dtxt + '</b> of spending money.');
  }
  rows += reason(ic(r.planned ? 'doc' : 'receiptx', 24), r.planned ? 'It <b>is in my plan</b>.' : 'It is <b>not in my plan</b> – it is an extra.');
  if (c.payday) rows += reason(ic('cal', 24), c.daysToPay === 0 ? 'It is <b>pay day today</b>.' : 'Pay day is in <b>' + c.daysToPay + ' day' + (c.daysToPay === 1 ? '' : 's') + '</b> (' + longDate(c.payday) + ').');
  if (r.card && r.interest > 0) rows += reason(ic('card', 24), 'On the ' + esc(r.card.name) + ' it adds about <b>' + money2(r.interest) + ' interest a month</b> while it stays on the card.');
  var acts = '<div class="btnrow three"><button class="btn sm ' + (r.verdict === 'ok' ? '' : 'ghost') + '" data-act="buyIt">Buy it</button><button class="btn sm ' + (r.verdict === 'ok' ? 'ghost' : '') + '" data-act="buyWait">' + (c.payday ? 'Remind me on pay day' : 'Add to wish list') + '</button><button class="btn sm ghost" data-act="buyNo">Don’t buy</button></div>';
  return '<section class="card ' + r.verdict + '" aria-live="polite"><div class="row">' + sig(r.verdict, 46) + '<div class="col"><span style="font-size:1.4rem;font-weight:700" class="' + r.verdict + '-ink">' + V[0] + '</span><span class="small ' + r.verdict + '-ink">' + V[1] + '</span></div></div>' + rows + '</section>' + acts;
}

/* ===== Money Planner – router, events, actions ===== */

var NAV_ROUTES = { today: 'today', inout: 'inout', calendar: 'inout', cards: 'cards', interest: 'cards', buy: 'buy', rules: 'buy', wish: 'buy', pots: 'today', streak: 'today' };

function route() {
  var h = (location.hash || '').replace(/^#\/?/, '');
  return h || 'today';
}
function go(r) {
  if (('#' + r) === location.hash) render(); else location.hash = '#' + r;
}

function skipInstall() { try { return sessionStorage.getItem('mp.skipInstall') === '1'; } catch (e) { return ui.skipInstall; } }

function applySettings() {
  var st = S.settings, el = document.documentElement;
  el.className = 'size-' + st.textSize + ' theme-' + st.theme + (st.motion ? '' : ' no-motion');
  var m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', st.theme === 'dark' ? '#12181D' : (st.theme === 'soft' ? '#F1EEE7' : '#F4F6F8'));
}

function resolve(r) {
  var parts = r.split('/'), base = parts[0];
  if (!isStandalone() && !skipInstall() && base !== 'install') return { base: 'install', html: vInstall };
  var setupFree = { setup: 1, item: 1, card: 1, pot: 1, pin: 1, install: 1 };
  if (!S.setupDone && !setupFree[base]) return { base: 'setup', html: vSetup, redirect: 'setup' };
  if (S.setupDone && !S.tourDone && base !== 'tour') return { base: 'tour', html: function () { return vTour(1); }, redirect: 'tour/1' };
  if (base === 'today') {
    var c = calc();
    if (c.status !== 'ok' && S.settings.warnStyle === 'full' && S.lastWarn !== iso(today()) + ':' + c.status) return { base: 'warning', html: vWarning, redirect: 'warning' };
  }
  switch (base) {
    case 'today': return { base: base, html: vToday, nav: true };
    case 'add': return { base: base, html: vAdd };
    case 'inout': return { base: base, html: vInOut, nav: true };
    case 'calendar': return { base: base, html: vCalendar, nav: true };
    case 'item': return { base: base, html: function () { return vItem(parts[1], parts[2]); }, pin: S.setupDone && parts[2] !== 'new' };
    case 'cards': return { base: base, html: vOwe, nav: true };
    case 'debt': return { base: base, html: function () { return vDebt(parts[1]); } };
    case 'card': return { base: base, html: function () { return vCard(parts[1]); } };
    case 'interest': return { base: base, html: vInterest, nav: true };
    case 'warning': return { base: base, html: vWarning, cls: calc().status === 'stop' ? 'stop' : 'warn' };
    case 'buy': return { base: base, html: vBuy, nav: true };
    case 'rules': return { base: base, html: vRules, nav: true };
    case 'wish': return { base: base, html: vWish, nav: true };
    case 'pots': return { base: base, html: vPots, nav: true };
    case 'pot': return { base: base, html: function () { return vPot(parts[1]); } };
    case 'streak': return { base: base, html: vStreak, nav: true };
    case 'reminders': return { base: base, html: vReminders };
    case 'checkin': return { base: base, html: vCheckIn };
    case 'settings': return { base: base, html: vSettings };
    case 'helper': return { base: base, html: vHelper };
    case 'privacy': return { base: base, html: vPrivacy };
    case 'print': return { base: base, html: vPrint };
    case 'tour': return { base: base, html: function () { return vTour(parseInt(parts[1], 10) || 1); }, cls: 'tint' };
    case 'setup': return { base: base, html: parts[1] ? function () { return vSetupStep(Math.max(1, Math.min(6, parseInt(parts[1], 10) || 1))); } : vSetup };
    case 'install': return { base: base, html: vInstall };
    case 'pin': return { base: base, html: vPin };

}

var lastRoute = null;
function render() {
  applySettings();
  var r = route(), res = resolve(r);
  if (res.redirect && res.redirect !== r) { history.replaceState(null, '', '#' + res.redirect); r = res.redirect; }
  if (res.base === 'item' && res.pin && needPin(null, null, r)) return;
  if (res.base === 'warning' && S.settings.vibrate && navigator.vibrate) { try { navigator.vibrate(200); } catch (e) {} }
  var app = document.getElementById('app');
  var body = '';
  try { body = res.html(); } catch (e) { body = '<div class="card stop"><b>Something went wrong on this screen.</b><span class="small">' + esc(e && e.message) + '</span><a class="btn" href="#today">Go to Today</a></div>'; if (window.console) console.error(e); }
  app.className = res.nav ? 'has-nav' : '';
  var html = '<main class="screen ' + (res.cls || '') + '" id="main">' + body + '</main>' + (res.nav ? nav(NAV_ROUTES[res.base] || '') : '') +
    (ui.help ? helpSheet(res.base) : '') + (ui.confirm ? confirmSheet() : '');
  // the "where I should be" line is drawn in the text colour, so it is white in the dark colours
  if (S.settings.theme === 'dark') html = html.replace(/black line/g, 'white line').replace(/Black line/g, 'White line');
  app.innerHTML = html;
  if (r !== lastRoute) {
    window.scrollTo(0, 0);
    var h1 = app.querySelector('h1'); if (h1) { h1.setAttribute('tabindex', '-1'); try { h1.focus({ preventScroll: true }); } catch (e) {} }
    lastRoute = r;
  }
  if (ui.help || ui.confirm) { var sh = app.querySelector('.sheet button:last-child, .sheet .btn'); if (sh) try { sh.focus(); } catch (e) {} }
}

/* PIN gate: returns true when the action has to wait for the PIN */
function needPin(act, id, gotoRoute) {
  if (!S.settings.pinLock || !S.settings.pin || !S.setupDone || ui.unlocked) return false;
  ui.pin = { mode: 'enter', entry: '', back: gotoRoute ? (lastRoute || 'today') : route(), next: { act: act, id: id, route: gotoRoute || null } };
  go('pin');
  return true;
}

function setByPath(group, val) {
  var p = group.split('.');
  if (p.length === 1) { ui[p[0]] = val; return; }
  if (p[0] === 'set') {
    var cur = S.settings[p[1]];
    S.settings[p[1]] = typeof cur === 'number' ? Number(val) : val;
    save(); return;
  }
  if (p[0] === 'rules') {
    if (needPin('pickRule', group + '=' + val)) return;
    S.settings.rules[p[1]] = Number(val); save(); return;
  }
  if (!ui[p[0]]) ui[p[0]] = {};
  ui[p[0]][p[1]] = val;
}

var ACTIONS = {

  closeHelp: function () { ui.help = false; render(); },

  pick: function (el) {

    if (g === 'add.type' && ui.add) { ui.add.type = v; ui.add.cat = v === 'out' ? 'Food shop' : 'Wages'; }
    else if (g === 'debt.type' && ui.debt) { ui.debt.type = v; if (!ui.debt.colourSet) ui.debt.colour = DEBT_COLOURS[v] || ui.debt.colour; }
    else if (g === 'debt.colour' && ui.debt) { ui.debt.colour = v; ui.debt.colourSet = true; }
    else setByPath(g, v);
    if (g.indexOf('buy.') === 0 && ui.buy) ui.buy.result = null;
    render();
  },
  pickRule: function (spec) { var p = spec.split('='); S.settings.rules[p[0].split('.')[1]] = Number(p[1]); save(); render(); },
  toggle: function (el) {
    var k = el.getAttribute('data-key'), p = k.split('.');
    if (k === 'set.pinLock') { return ACTIONS.pinLockToggle(); }
    if (p[0] === 'set') { S.settings[p[1]] = !S.settings[p[1]]; save(); }
    else if (p[0] === 'helper') { S.settings.helper[p[1]] = !S.settings.helper[p[1]]; save(); }
    else if (ui[p[0]]) ui[p[0]][p[1]] = !ui[p[0]][p[1]];
    render();
  },
  pinLockToggle: function () {
    if (S.settings.pinLock) { if (needPin('pinLockOff')) return; ACTIONS.pinLockOff(); }
    else { ui.pin = { mode: 'set', entry: '', back: route() }; go('pin'); }
  },
  pinLockOff: function () { S.settings.pinLock = false; S.settings.pin = null; save(); toast('PIN lock is off'); render(); },
  changePin: function () { if (needPin('changePin')) return; ui.pin = { mode: 'set', entry: '', back: route() }; go('pin'); },
  pinKey: function (el) {

/* ---------- files ---------- */
function downloadFile(name, mime, content) {
  var blob = new Blob([content], { type: mime });
  try {
    var file = new File([blob], name, { type: mime });
    if (navigator.canShare && navigator.canShare({ files: [file] }) && isIOS()) {
      return navigator.share({ files: [file], title: name }).then(function () { return true; }).catch(function () { return false; });
    }
  } catch (e) {}
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  return Promise.resolve(true);
}
function doBackup() {
  var name = 'money-planner-backup-' + iso(today()) + '.json';
  var data = JSON.stringify({ app: 'money-planner', version: APP_VERSION, exported: new Date().toISOString(), state: S }, null, 1);
  downloadFile(name, 'application/json', data).then(function (ok) { if (ok !== false) { S.lastBackup = iso(today()); save(); toast('Backup saved'); render(); } });
}
function restoreFrom(file) {
  var r = new FileReader();
  r.onload = function () {
    try {
      var d = JSON.parse(r.result);
      if (!d || d.app !== 'money-planner' || !d.state) throw new Error('not ours');
      S = mergeDefaults(d.state); save(); ui = resetUI(); ui.unlocked = true; toast('Backup restored'); go('today');
    } catch (e) { toast('That file is not a Money Planner backup'); }
  };
  r.readAsText(file);
}
function csvCell(v) { v = String(v === undefined || v === null ? '' : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
function exportCSV() {
  var rows = [['Date', 'In or out', 'Amount', 'Category', 'Name', 'Paid with', 'Planned']];
  S.tx.slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; }).forEach(function (t) { rows.push([t.date, t.type, t.amount.toFixed(2), t.category, t.name, t.type === 'out' ? paidWithName(t.paidWith) : '', t.planned ? 'yes' : 'no']); });
  rows.push([]); rows.push(['Regular', 'In or out', 'Amount', 'How often', 'Name']);
  S.incomes.forEach(function (i) { rows.push([freqText(i), 'in', i.amount.toFixed(2), FREQS[i.freq], i.name]); });
  allBills().forEach(function (b) { rows.push([freqText(b), 'out', b.amount.toFixed(2), FREQS[b.freq], b.name]); });
  rows.push([]); rows.push(['Card', 'Owed', 'Limit', 'APR %', 'Monthly interest (estimate)']);
  S.accounts.forEach(function (a) { rows.push([a.name, (a.balance || 0).toFixed(2), (a.limit || 0).toFixed(2), a.apr || '', monthlyInterest(a).toFixed(2)]); });
  rows.push([]); rows.push(['Debt', 'Type', 'Owed to', 'Owed', 'Started at', 'APR %', 'Monthly payment', 'Monthly interest (estimate)']);
  S.debts.forEach(function (d) { rows.push([debtTitle(d), debtType(d.type)[1], d.owedTo || '', (d.balance || 0).toFixed(2), (d.original || 0).toFixed(2), d.apr || '', (d.payment || 0).toFixed(2), monthlyInterest(d).toFixed(2)]); });
  downloadFile('money-planner-' + iso(today()) + '.csv', 'text/csv', '﻿' + rows.map(function (r) { return r.map(csvCell).join(','); }).join('\r\n'));
}
function copyText(text, msg) {
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { toast(msg); }, function () { toast('Could not copy'); });
  else toast('Sharing is not available here');
}

  var act = el.getAttribute('data-act');
  if ((act === 'closeHelp' || act === 'closeConfirm') && el.classList.contains('overlay') && e.target.closest('[data-stop]')) return;
  if (el.tagName === 'A' && act === 'closeHelp') { ui.help = false; return; }
  if (el.tagName === 'A' && act === 'cancelAdd') { ui.add = null; return; }
  if (ACTIONS[act]) { e.preventDefault(); ACTIONS[act](el); }
});

    var f = ui[p[0]], tEl = document.querySelector('[data-pv="title"]'), oEl = document.querySelector('[data-pv="owed"]');
    if (tEl) tEl.textContent = p[0] === 'card' ? (f.name || 'Name') : (f.name || f.owedTo || debtType(f.type)[1]);
    if (oEl) oEl.textContent = money0(num(f.balance) || 0) + ' owed';
  }
});
document.addEventListener('change', function (e) {
  if (e.target && e.target.getAttribute && e.target.getAttribute('data-change') === 'startDay') { ACTIONS.setStartDay(e.target.value); return; }
  if (e.target && e.target.getAttribute && e.target.getAttribute('data-bind') === 'item.date') { render(); return; }
  if (e.target && e.target.id === 'restore-file' && e.target.files && e.target.files[0]) restoreFrom(e.target.files[0]);
  var b = e.target.getAttribute && e.target.getAttribute('data-bind');
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && (ui.help || ui.confirm)) { ui.help = false; ui.confirm = null; render(); }
});
window.addEventListener('hashchange', function () {
  var r = route(), base = r.split('/')[0], prev = lastRoute ? lastRoute.split('/')[0] : '';
  if (base !== 'pin') {
    if (base !== 'add') ui.add = null;
    if (base !== 'item') ui.item = null;
    if (base !== 'card') ui.card = null;
    if (base !== 'pot') ui.pot = null;
    if (base !== 'debt') ui.debt = null;
  }
  if (base === 'setup') { ui.itemBack = r; ui.cardBack = r; ui.potBack = r; ui.debtBack = r; }
  else if (base === 'checkin') { ui.cardBack = 'checkin'; ui.debtBack = 'checkin'; }
  else if (base === 'inout') ui.itemBack = 'inout';
  else if (base === 'cards') { ui.cardBack = 'cards'; ui.debtBack = 'cards'; }
  else if (base === 'pots') ui.potBack = 'pots';
  if (base === 'checkin' && ['card', 'debt', 'add', 'pin', 'checkin'].indexOf(prev) < 0) ui.ciStep = 0;
  ui.help = false; ui.confirm = null;
  render();
});
window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); installPrompt = e; if (route().indexOf('install') === 0 || !isStandalone()) render(); });
window.addEventListener('appinstalled', function () { installPrompt = null; });
window.addEventListener('pageshow', function () { render(); });
document.addEventListener('visibilitychange', function () { if (!document.hidden) { applyMonthlyPots(); save(); render(); } });

/* ---------- start ---------- */
(function start() {
  if (!S.startDate && S.setupDone) S.startDate = iso(today());
  if (S.setupDone) applyMonthlyPots();
  save();
  render();
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
})();

</script>
